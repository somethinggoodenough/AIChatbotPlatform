# Gemini OpenAI-compatibility profile. Native Gemini-only features belong in a
# separate adapter rather than in this Chat Completions compatibility profile.
[profile]
name = "gemini"
protocol = "chat_completions"
base_url_env = "GEMINI_BASE_URL"
model_env = "GEMINI_MODEL"
api_key_env = "GEMINI_API_KEY"
api_key_required = true
endpoint = "/chat/completions"
auth_header = "Authorization"
auth_prefix = "Bearer "

[capabilities]
streaming = true
json_schema = true
# Gemini documents schema output through OpenAI compatibility, but strict
# behavior is left off until its exact subset is covered by a live probe.
strict_json_schema = false
reasoning = false
tools = false
temperature = true

[request]
max_tokens_field = "max_tokens"
stream_usage = true

[usage]
input_tokens = "prompt_tokens"
output_tokens = "completion_tokens"
cache_read_tokens = "prompt_tokens_details.cached_tokens"
cache_write_tokens = ""
reasoning_tokens = "completion_tokens_details.reasoning_tokens"
input_includes_cache = true
stream_mode = "cumulative"

[errors]
code_paths = ["error.code", "error.status", "error.type"]

[pricing]
currency = "USD"
