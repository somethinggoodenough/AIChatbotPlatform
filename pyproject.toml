[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-chatbot-platform"
version = "0.1.0"
description = "LLM serving and agent runtime platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_serving"]
